<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Особистий кабінет — Медова Пасіка 🐝</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Підключення Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-amber: #ff9800;
            --dark-amber: #e65100;
            --bg-gradient: linear-gradient(135deg, #fffde7 0%, #fff9c4 40%, #ffe082 100%);
            --card-shadow: 0 10px 25px rgba(230, 81, 0, 0.12), 0 4px 12px rgba(255, 152, 0, 0.15);
            --text-main: #3e2723;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { 
            background: var(--bg-gradient); 
            background-attachment: fixed; 
            color: var(--text-main); 
            min-height: 100vh; 
            padding: 20px; 
            font-size: 0.9rem;
            position: relative;
        }
        /* Легкий медовый паттерн для настроения */
        body::before {
            content: "🍯 🐝 🌻 🍯 🐝 🌻";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.04;
            font-size: 3rem;
            line-height: 200px;
            word-spacing: 150px;
            pointer-events: none;
            z-index: -1;
            text-align: center;
        }
        .container { max-width: 650px; margin: 0 auto; background: #ffffff; border-radius: 20px; padding: 25px; box-shadow: var(--card-shadow); border: 2px solid #ffecb3; }
        h1, h2 { font-family: 'Comfortaa', cursive; color: var(--dark-amber); text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: var(--dark-amber); }
        .form-control { width: 100%; padding: 12px 15px; border: 2px solid #ffe0b2; border-radius: 12px; font-size: 0.95rem; background: #fffde7; outline: none; transition: all 0.3s ease; }
        .form-control:focus { border-color: #ff9800; background: #fff; box-shadow: 0 0 8px rgba(255, 152, 0, 0.3); }
        .btn { background: linear-gradient(135deg, #ffb300 0%, #f57c00 100%); color: white; border: none; padding: 13px; border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%; font-size: 1rem; box-shadow: 0 5px 15px rgba(245, 124, 0, 0.3); transition: transform 0.2s, box-shadow 0.2s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 7px 20px rgba(245, 124, 0, 0.4); }
        .btn-secondary { background: #8d6e63; margin-top: 10px; box-shadow: 0 5px 15px rgba(141, 110, 99, 0.3); }
        .btn-password { background: linear-gradient(135deg, #8d6e63 0%, #5d4037 100%); margin-top: 10px; }
        
        /* Стилі для кнопки Google */
        .btn-google { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; background: #fff; color: #333; border: 2px solid #ffe0b2; margin-top: 15px; transition: all 0.2s; box-shadow: 0 3px 10px rgba(0,0,0,0.05); }
        .btn-google:hover { background: #fffde7; transform: translateY(-2px); }
        .divider { text-align: center; margin: 15px 0; position: relative; color: #8d6e63; font-size: 0.85rem; font-weight: 600; }
        .divider::before, .divider::after { content: ""; position: absolute; top: 50%; width: 40%; height: 2px; background: #ffe0b2; }
        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .card { background: #fffde7; border: 2px solid #ffecb3; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(255, 193, 7, 0.1); }
        .nav-links { display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center; }
        .nav-links a { color: var(--dark-amber); text-decoration: none; font-weight: 700; transition: color 0.2s; }
        .nav-links a:hover { color: #ff6f00; text-decoration: underline; }
        .switch-mode { text-align: center; margin-top: 15px; font-size: 0.9rem; color: #666; }
        .switch-mode a { color: var(--dark-amber); font-weight: 700; cursor: pointer; text-decoration: underline; }
        .switch-mode a:hover { color: #ff6f00; }
        
        .orders-table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .orders-table th { background: #ffe082; color: #e65100; padding: 10px; font-size: 0.85rem; text-align: left; }
        .orders-table td { border-bottom: 1px solid #ffe0b2; padding: 10px; font-size: 0.85rem; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 8px; font-weight: 600; font-size: 0.75rem; background: #e0f2f1; color: #00796b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-links">
            <a href="index.html">← На головну сайту</a>
            <span id="headerUserIdent" style="font-weight: 600; font-size: 0.85rem; color: #5d4037;"></span>
        </div>

        <!-- ФОРМА ВХОДУ / РЕЄСТРАЦІЇ -->
        <div id="authContainer" style="display: none;">
            <h1 id="authTitle">🔐 Вхід в акаунт</h1>
            
            <div class="card" style="max-width: 450px; margin: 0 auto;">
                <!-- Форма Входу (теперь идет первой по умолчанию!) -->
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Телефон або Email:</label>
                        <input type="text" id="loginLogin" class="form-control" required placeholder="Ваш телефон або email">
                    </div>
                    <div class="form-group">
                        <label>Пароль:</label>
                        <input type="password" id="loginPass" class="form-control" required placeholder="Ваш пароль">
                    </div>
                    <button type="submit" class="btn">Увійти в акаунт 🐝</button>
                    
                    <div class="divider">або</div>
                    
                    <!-- Кнопка Google Auth -->
                    <button type="button" class="btn btn-google" onclick="loginWithGoogle()">
                        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.19-1.84H9v3.48h4.84c-.21 1.12-.84 2.07-1.79 2.71v2.25h2.9c1.7-1.57 2.69-3.88 2.69-6.6z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.25c-.81.54-1.84.86-3.06.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33C2.46 15.83 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.72c-.18-.54-.28-1.12-.28-1.72s.1-1.18.28-1.72V4.95H.96C.35 6.18 0 7.55 0 9s.35 2.82.96 4.05l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.47.89 11.43 0 9 0 5.48 0 2.46 2.17.96 4.95l3.01 2.33c.71-2.13 2.69-3.7 5.03-3.7z"/></svg>
                        Увійти через Google
                    </button>

                    <div class="switch-mode">
                        Ще немає акаунта? <a onclick="switchMode('register')">Зареєструватися</a>
                    </div>
                </form>

                <!-- Форма Реєстрації -->
                <form id="registerForm" onsubmit="handleRegister(event)" style="display: none;">
                    <div class="form-group">
                        <label>Телефон або Email:</label>
                        <input type="text" id="regLogin" class="form-control" required placeholder="+380... або example@mail.com">
                    </div>
                    <div class="form-group">
                        <label>Пароль:</label>
                        <input type="password" id="regPass" class="form-control" required placeholder="Мінімум 4 символи">
                    </div>
                    <button type="submit" class="btn">Зареєструватися 🍯</button>
                    
                    <div class="divider">або</div>
                    
                    <!-- Кнопка Google Auth -->
                    <button type="button" class="btn btn-google" onclick="loginWithGoogle()">
                        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.19-1.84H9v3.48h4.84c-.21 1.12-.84 2.07-1.79 2.71v2.25h2.9c1.7-1.57 2.69-3.88 2.69-6.6z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.25c-.81.54-1.84.86-3.06.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33C2.46 15.83 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.72c-.18-.54-.28-1.12-.28-1.72s.1-1.18.28-1.72V4.95H.96C.35 6.18 0 7.55 0 9s.35 2.82.96 4.05l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.47.89 11.43 0 9 0 5.48 0 2.46 2.17.96 4.95l3.01 2.33c.71-2.13 2.69-3.7 5.03-3.7 z"/></svg>
                        Увійти через Google
                    </button>

                    <div class="switch-mode">
                        Вже маєте акаунт? <a onclick="switchMode('login')">Увійти</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- ОСОБИСТИЙ КАБІНЕТ КЛІЄНТА -->
        <div id="profileContainer" style="display: none;">
            <h1>🌻 Особистий кабінет покупця</h1>
            
            <div class="card">
                <h2>✨ Ваші дані та налаштування</h2>
                <form onsubmit="saveProfileData(event)">
                    <div class="form-group">
                        <label>Логін (Телефон / Email):</label>
                        <input type="text" id="profLoginDisplay" class="form-control" disabled style="background: #f5f5f5;">
                    </div>
                    <div class="form-group">
                        <label>ПІБ (Прізвище, Ім'я, По батькові):</label>
                        <input type="text" id="profFullName" class="form-control" placeholder="Іванов Іван Іванович">
                    </div>
                    <div class="form-group">
                        <label>Адреса доставки (Місто, № відділення пошти):</label>
                        <input type="text" id="profAddress" class="form-control" placeholder="м. Одеса, Нова Пошта №5">
                    </div>
                    <button type="submit" class="btn">Зберегти зміни в профілі 💾</button>
                </form>
            </div>

            <!-- Блок зміни пароля для звичайних користувачів -->
            <div class="card" id="passwordChangeCard">
                <h2>🔐 Зміна пароля</h2>
                <form onsubmit="changePassword(event)">
                    <div class="form-group">
                        <label>Старий пароль:</label>
                        <input type="password" id="oldPass" class="form-control" required placeholder="Введіть поточний пароль">
                    </div>
                    <div class="form-group">
                        <label>Новий пароль:</label>
                        <input type="password" id="newPass" class="form-control" required placeholder="Мінімум 4 символи">
                    </div>
                    <button type="submit" class="btn btn-password">Змінити пароль 🔑</button>
                </form>
            </div>

            <div class="card">
                <h2>💛 Список бажань (Обрані товари)</h2>
                <div id="userWishlistList" style="font-size: 0.85rem; color: #5d4037;">Ваш список бажань поки порожній.</div>
            </div>

            <div class="card">
                <h2>📦 Історія замовлень</h2>
                <div id="userOrdersList" style="font-size: 0.85rem; color: #5d4037;">Завантаження замовлень...</div>
            </div>

            <button class="btn btn-secondary" onclick="handleLogout()">Вийти з акаунта 🚪</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://wamchptycjrvrspfksaz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_lG-14NlLDyfmdeJTZ-a3Lg_oxyFvv3F";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        try {
            currentUser = JSON.parse(localStorage.getItem('medova_current_user')) || null;
        } catch(e) { currentUser = null; }

        async function checkGoogleAuthRedirect() {
            try {
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                if (session && session.user) {
                    const googleEmail = session.user.email;
                    const googleName = session.user.user_metadata?.full_name || '';
                    
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/users?login=eq.${encodeURIComponent(googleEmail)}`, {
                        method: 'GET',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        }
                    });
                    const existingUsers = await response.json();

                    if (existingUsers && existingUsers.length > 0) {
                        currentUser = existingUsers[0];
                    } else {
                        const newGoogleUser = {
                            id: 'usr_' + Date.now(),
                            login: googleEmail,
                            pass: 'google_oauth_secure',
                            full_name: googleName,
                            address: '',
                            data: { orders: [], wishlist: [] }
                        };

                        const createRes = await fetch(`${SUPABASE_URL}/rest/v1/users`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`,
                                'Prefer': 'return=representation'
                            },
                            body: JSON.stringify(newGoogleUser)
                        });
                        
                        if (createRes.ok) {
                            currentUser = newGoogleUser;
                        }
                    }

                    if (currentUser) {
                        localStorage.setItem('medova_current_user', JSON.stringify(currentUser));
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }
                }
            } catch (err) {
                console.error("Помилка обробки Google сесії:", err);
            }
        }

        async function loginWithGoogle() {
            try {
                const { data, error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + window.location.pathname
                    }
                });
                if (error) {
                    alert("Помилка Google входу: " + error.message);
                }
            } catch (err) {
                console.error(err);
                alert("Не вдалося ініціювати вхід через Google.");
            }
        }

        async function initAccountPage() {
            await checkGoogleAuthRedirect();
            
            try {
                currentUser = JSON.parse(localStorage.getItem('medova_current_user')) || null;
            } catch(e) { currentUser = null; }

            const authCont = document.getElementById('authContainer');
            const profCont = document.getElementById('profileContainer');
            const headerIdent = document.getElementById('headerUserIdent');
            const passCard = document.getElementById('passwordChangeCard');

            if (!currentUser) {
                authCont.style.display = 'block';
                profCont.style.display = 'none';
                headerIdent.innerText = '';
            } else {
                authCont.style.display = 'none';
                profCont.style.display = 'block';
                headerIdent.innerText = currentUser.login;
                
                document.getElementById('profLoginDisplay').value = currentUser.login;
                document.getElementById('profFullName').value = currentUser.full_name || '';
                document.getElementById('profAddress').value = currentUser.address || '';
                
                if (passCard) {
                    passCard.style.display = (currentUser.pass === 'google_oauth_secure') ? 'none' : 'block';
                }

                renderWishlist();
                renderOrders();
            }
        }

        function switchMode(mode) {
            const regForm = document.getElementById('registerForm');
            const loginForm = document.getElementById('loginForm');
            const title = document.getElementById('authTitle');
            if (mode === 'login') {
                regForm.style.display = 'none';
                loginForm.style.display = 'block';
                title.innerText = '🔐 Вхід в акаунт';
            } else {
                loginForm.style.display = 'none';
                regForm.style.display = 'block';
                title.innerText = '👤 Реєстрація акаунта';
            }
        }

        function validateInput(val) {
            const clean = val.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const phoneRegex = /^\+?[0-9]{9,15}$/;
            if (emailRegex.test(clean) || phoneRegex.test(clean.replace(/[\s\-\(\)]/g, ''))) {
                return clean;
            }
            return null;
        }

        async function handleRegister(e) {
            e.preventDefault();
            const loginInput = document.getElementById('regLogin').value;
            const pass = document.getElementById('regPass').value.trim();
            const validLogin = validateInput(loginInput);

            if (!validLogin) {
                alert("Помилка! Введіть коректний номер телефону (наприклад +380...) або дійсний Email.");
                return;
            }
            if (pass.length < 4) {
                alert("Пароль занадто короткий (мінімум 4 символи).");
                return;
            }

            const newUserData = {
                id: 'usr_' + Date.now(),
                login: validLogin,
                pass: pass,
                full_name: '',
                address: '',
                data: { orders: [], wishlist: [] }
            };

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/users`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(newUserData)
                });

                if (!response.ok) {
                    const err = await response.json();
                    if (err.code === '23505') {
                        alert("Користувач з таким логіном вже зареєстрований у базі!");
                        switchMode('login');
                        return;
                    }
                    throw new Error(err.message || "Помилка сервера");
                }

                currentUser = newUserData;
                localStorage.setItem('medova_current_user', JSON.stringify(currentUser));
                alert("Реєстрація успішна! Ласкаво просимо на пасіку! 🍯");
                initAccountPage();
            } catch (err) {
                console.error(err);
                alert("Помилка зв'язку з базою даних. Спробуйте ще раз.");
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const loginInput = document.getElementById('loginLogin').value;
            const pass = document.getElementById('loginPass').value.trim();
            const validLogin = validateInput(loginInput);

            if (!validLogin) {
                alert("Введіть коректний телефон або email.");
                return;
            }

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/users?login=eq.${encodeURIComponent(validLogin)}&pass=eq.${encodeURIComponent(pass)}`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!response.ok) throw new Error("Помилка запиту");

                const users = await response.json();
                if (users && users.length > 0) {
                    currentUser = users[0];
                    localStorage.setItem('medova_current_user', JSON.stringify(currentUser));
                    alert("Вхід успішний! Раді бачити знову! 🐝");
                    initAccountPage();
                } else {
                    alert("Невірний логін або пароль, або користувача не знайдено.");
                }
            } catch (err) {
                console.error(err);
                alert("Помилка зв'язку з базою даних.");
            }
        }

        async function changePassword(e) {
            e.preventDefault();
            if (!currentUser) return;

            if (currentUser.pass === 'google_oauth_secure') {
                alert("Користувачі, що увійшли через Google, не використовують звичайний пароль сайту.");
                return;
            }

            const oldPassInput = document.getElementById('oldPass').value.trim();
            const newPassInput = document.getElementById('newPass').value.trim();

            if (oldPassInput !== currentUser.pass) {
                alert("Помилка! Введено невірний старий пароль.");
                return;
            }

            if (newPassInput.length < 4) {
                alert("Новий пароль занадто короткий (мінімум 4 символи).");
                return;
            }

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${currentUser.id}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify({
                        pass: newPassInput
                    })
                });

                if (!response.ok) throw new Error("Помилка оновлення пароля");

                currentUser.pass = newPassInput;
                localStorage.setItem('medova_current_user', JSON.stringify(currentUser));
                
                alert("Пароль успішно змінено!");
                document.getElementById('oldPass').value = '';
                document.getElementById('newPass').value = '';
            } catch (err) {
                console.error(err);
                alert("Не вдалося оновити пароль у базі даних.");
            }
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('medova_current_user');
            supabaseClient.auth.signOut();
            initAccountPage();
        }

        async function saveProfileData(e) {
            e.preventDefault();
            if (!currentUser) return;

            currentUser.full_name = document.getElementById('profFullName').value.trim();
            currentUser.address = document.getElementById('profAddress').value.trim();

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${currentUser.id}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify({
                        full_name: currentUser.full_name,
                        address: currentUser.address,
                        data: currentUser.data
                    })
                });

                if (!response.ok) throw new Error("Помилка оновлення");

                localStorage.setItem('medova_current_user', JSON.stringify(currentUser));
                alert("Зміни в профілі успішно збережено в хмару! 🍯");
            } catch (err) {
                console.error(err);
                alert("Не вдалося зберегти зміни в базі даних.");
            }
        }

        function renderWishlist() {
            const container = document.getElementById('userWishlistList');
            const wishlist = currentUser.data?.wishlist || [];
            if (wishlist.length === 0) {
                container.innerHTML = 'Ваш список бажань поки порожній.';
                return;
            }
            container.innerHTML = '<ul>' + wishlist.map(item => `<li>${item}</li>`).join('') + '</ul>';
        }

        async function renderOrders() {
            const container = document.getElementById('userOrdersList');
            if (!currentUser || !currentUser.login) return;

            container.innerHTML = 'Завантаження замовлень...';

            try {
                const encodedLogin = encodeURIComponent(currentUser.login);
                const response = await fetch(`${SUPABASE_URL}/rest/v1/orders?phone=eq.${encodedLogin}&order=created_at.desc`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!response.ok) throw new Error("Помилка завантаження");

                const orders = await response.json();

                if (!orders || orders.length === 0) {
                    container.innerHTML = 'У вас поки немає замовлень.';
                    return;
                }

                let html = `
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>Дата</th>
                            <th>Товари</th>
                            <th>Сума</th>
                            <th>Статус</th>
                        </tr>
                    </thead>
                    <tbody>`;

                orders.forEach(ord => {
                    let formattedDate = 'Не вказано';
                    if (ord.created_at) {
                        const d = new Date(ord.created_at);
                        formattedDate = d.toLocaleDateString('uk-UA') + ' ' + d.toLocaleTimeString('uk-UA', {hour: '2-digit', minute:'2-digit'});
                    }

                    html += `
                        <tr>
                            <td>${formattedDate}</td>
                            <td>${ord.items || '-'}</td>
                            <td><b>${ord.total_price || 0} грн</b></td>
                            <td><span class="status-badge">${ord.status || 'Нове'}</span></td>
                        </tr>`;
                });

                html += `</tbody></table>`;
                container.innerHTML = html;

            } catch (err) {
                console.error("Помилка при отриманні замовлень:", err);
                container.innerHTML = 'Помилка завантаження замовлень з бази даних.';
            }
        }

        document.addEventListener('DOMContentLoaded', initAccountPage);
    </script>
</body>
</html>
