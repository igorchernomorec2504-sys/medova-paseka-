<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Особистий кабінет — Медова Пасіка</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-amber: #829b33;
            --dark-amber: #5a6d22;
            --accent-btn: #8fb339;
            --bg-gradient: #fcf9f2;
            --card-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            --text-main: #332417;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding: 15px; font-size: 0.9rem; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 20px; box-shadow: var(--card-shadow); border: 1px solid #eee; }
        .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .nav-header a { color: var(--text-main); text-decoration: none; font-size: 1.2rem; }
        .auth-tabs { display: flex; justify-content: center; gap: 30px; margin-bottom: 25px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }
        .auth-tab { font-family: 'Comfortaa', cursive; font-size: 1.1rem; color: #aaa; cursor: pointer; background: none; border: none; font-weight: 700; padding-bottom: 5px; }
        .auth-tab.active { color: var(--dark-amber); border-bottom: 3px solid var(--accent-btn); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #666; font-size: 0.85rem; }
        .form-control { width: 100%; padding: 12px 14px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 0.95rem; background: #fff; outline: none; }
        .form-control:focus { border-color: var(--accent-btn); }
        .form-control:disabled { background: #f9f9f9; color: #888; }
        .btn { background: #9bc53d; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; font-size: 1rem; text-align: center; display: block; text-decoration: none; }
        .btn:hover { background: #87b031; }
        .btn-secondary { background: #795548; margin-top: 15px; }
        .profile-tabs { display: flex; justify-content: space-between; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        .profile-tab { font-family: 'Comfortaa', cursive; font-size: 1rem; color: #777; cursor: pointer; background: none; border: none; font-weight: 700; }
        .profile-tab.active { color: var(--dark-amber); border-bottom: 3px solid var(--accent-btn); padding-bottom: 4px; }
        .card-section { display: none; }
        .card-section.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-header">
            <a href="index.html">✕</a>
            <span style="font-weight: 700; font-size: 0.95rem;">Особистий кабінет</span>
            <a href="index.html">🛒</a>
        </div>

        <div id="authContainer">
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchAuthTab('login')" id="tabLoginBtn">Вхід</button>
                <button class="auth-tab" onclick="switchAuthTab('register')" id="tabRegBtn">Реєстрація</button>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Номер телефону або пошта</label>
                    <input type="text" id="loginInput" class="form-control" required placeholder="+380...">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="loginPass" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn">Увійти</button>
            </form>

            <form id="registerForm" onsubmit="handleRegister(event)" style="display: none;">
                <div class="form-group">
                    <label>Номер телефону або пошта</label>
                    <input type="text" id="regInput" class="form-control" required placeholder="+380...">
                </div>
                <div class="form-group">
                    <label>Пароль (мін. 4 символи)</label>
                    <input type="password" id="regPass" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn" style="margin-top: 10px;">Зареєструватися</button>
            </form>
        </div>

        <div id="profileContainer" style="display: none;">
            <div class="profile-tabs">
                <button class="profile-tab active" onclick="switchProfileTab('profile')" id="pTab1">Профіль</button>
                <button class="profile-tab" onclick="switchProfileTab('orders')" id="pTab2">Замовлення</button>
                <button class="profile-tab" onclick="switchProfileTab('wishlist')" id="pTab3">Обране</button>
            </div>

            <div id="sectionProfile" class="card-section active">
                <form onsubmit="saveProfileData(event)">
                    <div class="form-group">
                        <label>Ім'я та прізвище</label>
                        <input type="text" id="profFullName" class="form-control" placeholder="Ігор Чорноморець">
                    </div>
                    <div class="form-group">
                        <label>Логін (Телефон)</label>
                        <input type="text" id="profLoginDisplay" class="form-control" disabled>
                    </div>
                    <div class="form-group">
                        <label>Місто</label>
                        <input type="text" id="profCity" class="form-control" placeholder="м. Одеса">
                    </div>
                    <div class="form-group">
                        <label>Адреса (№ відділення пошти)</label>
                        <input type="text" id="profAddress" class="form-control" placeholder="Нова Пошта №5">
                    </div>
                    <button type="submit" class="btn">Зберегти зміни</button>
                </form>
                <button class="btn btn-secondary" onclick="handleLogout()">Вийти з акаунта</button>
            </div>

            <div id="sectionOrders" class="card-section">
                <div id="userOrdersList" style="color: #666; font-size: 0.85rem; text-align: center; padding: 20px;">У вас поки немає замовлень.</div>
            </div>

            <div id="sectionWishlist" class="card-section">
                <div id="userWishlistList" style="color: #666; font-size: 0.85rem; text-align: center; padding: 20px;">Ваш список обраного порожній.</div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://wamchptycjrvrspfksaz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_lG-14NlLDyfmdeJTZ-a3Lg_oxyFvv3F";

        let currentUser = null;
        try { currentUser = JSON.parse(localStorage.getItem('medova_current_client')) || null; } catch(e) { currentUser = null; }

        function initApp() {
            if (!currentUser) {
                document.getElementById('authContainer').style.display = 'block';
                document.getElementById('profileContainer').style.display = 'none';
            } else {
                document.getElementById('authContainer').style.display = 'none';
                document.getElementById('profileContainer').style.display = 'block';
                
                document.getElementById('profFullName').value = currentUser.profile?.full_name || '';
                document.getElementById('profLoginDisplay').value = currentUser.phone || '';
                document.getElementById('profCity').value = currentUser.profile?.city || '';
                document.getElementById('profAddress').value = currentUser.profile?.address || '';
            }
        }

        function switchAuthTab(tab) {
            if (tab === 'login') {
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('tabLoginBtn').classList.add('active');
                document.getElementById('tabRegBtn').classList.remove('active');
            } else {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
                document.getElementById('tabRegBtn').classList.add('active');
                document.getElementById('tabLoginBtn').classList.remove('active');
            }
        }

        function switchProfileTab(section) {
            document.getElementById('sectionProfile').classList.remove('active');
            document.getElementById('sectionOrders').classList.remove('active');
            document.getElementById('sectionWishlist').classList.remove('active');
            document.getElementById('pTab1').classList.remove('active');
            document.getElementById('pTab2').classList.remove('active');
            document.getElementById('pTab3').classList.remove('active');

            if (section === 'profile') {
                document.getElementById('sectionProfile').classList.add('active');
                document.getElementById('pTab1').classList.add('active');
            } else if (section === 'orders') {
                document.getElementById('sectionOrders').classList.add('active');
                document.getElementById('pTab2').classList.add('active');
            } else if (section === 'wishlist') {
                document.getElementById('sectionWishlist').classList.add('active');
                document.getElementById('pTab3').classList.add('active');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const phone = document.getElementById('regInput').value.trim();
            const pass = document.getElementById('regPass').value.trim();

            if (pass.length < 4) { alert("Пароль занадто короткий (мін. 4 символи)!"); return; }

            const newClient = {
                id: 'cli_' + Date.now(),
                phone: phone,
                pass: pass,
                profile: { full_name: '', city: '', address: '', orders: [], wishlist: [] }
            };

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/clients`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    },
                    body: JSON.stringify(newClient)
                });

                if (res.status >= 200 && res.status < 300) {
                    currentUser = newClient;
                    localStorage.setItem('medova_current_client', JSON.stringify(currentUser));
                    alert("Реєстрація успішна!");
                    initApp();
                } else {
                    const err = await res.text();
                    console.log(err);
                    alert("Помилка створення акаунта.");
                }
            } catch (err) {
                alert("Помилка з'єднання.");
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('loginInput').value.trim();
            const pass = document.getElementById('loginPass').value.trim();

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/clients?phone=eq.${encodeURIComponent(phone)}&pass=eq.${encodeURIComponent(pass)}`, {
                    method: 'GET',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });

                const clients = await res.json();
                if (clients && clients.length > 0) {
                    currentUser = clients[0];
                    localStorage.setItem('medova_current_client', JSON.stringify(currentUser));
                    initApp();
                } else {
                    alert("Невірний телефон або пароль!");
                }
            } catch (err) {
                alert("Помилка входу.");
            }
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('medova_current_client');
            initApp();
        }

        async function saveProfileData(e) {
            e.preventDefault();
            if (!currentUser) return;

            currentUser.profile.full_name = document.getElementById('profFullName').value.trim();
            currentUser.profile.city = document.getElementById('profCity').value.trim();
            currentUser.profile.address = document.getElementById('profAddress').value.trim();

            try {
                await fetch(`${SUPABASE_URL}/rest/v1/clients?id=eq.${currentUser.id}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    },
                    body: JSON.stringify({ profile: currentUser.profile })
                });

                localStorage.setItem('medova_current_client', JSON.stringify(currentUser));
                alert("Зміни збережено!");
            } catch (err) {
                alert("Помилка збереження.");
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
