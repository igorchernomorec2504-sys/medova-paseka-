<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <style>

            --bg-light: #fcf9f2;
            --bg-card: #ffffff;
            --primary-amber: #e68a00;
            --dark-amber: #995200;

            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-light);
            background-image:

        .product-card {

        .product-card:hover {

        .badge-highlight {

        .modal-close-x {

        .cart-item-row {

        .cart-item-row small {

        .remove-btn {

            color: white;
            border: none;
            width: 26px;
            height: 26px;

            font-weight: 700;

        .form-group {

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.92rem;

            color: var(--text-main);
            outline: none;

        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--primary-amber);
        }

        .cart-action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-checkout-start {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border: none;
            padding: 14px;

        .btn-continue-shopping {

        }

        .btn-continue-shopping:hover {
            background: var(--primary-amber);
            color: white;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-submit {
            flex: 1;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);

        .btn-close {
            background: #f0f0f0;

        }

        footer {

            margin-top: 36px;

        }

        .footer-year {

    </style>
</head>
<body>

    <div class="top-nav-bar">
        <a href="index.html" class="top-nav-btn">← <span id="nav-back-text">Повернутися до каталогу</span></a>
        
        <button class="top-nav-btn" onclick="openCartModal()">

    <header>

    <!-- Модальне вікно Кошика -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div class="modal-header-row">
                <h3 id="modal-title">Ваш Кошик</h3>
                <button type="button" class="modal-close-x" onclick="closeCartModal()">✕</button>
            </div>
            
            <div id="cartItemsList" style="margin-bottom: 15px;"></div>

            <div id="deliveryProgressBox" style="background: #fff3db; border: 1.5px dashed var(--primary-amber); padding: 10px 12px; border-radius: 12px; margin-bottom: 12px; font-size: 0.85rem; text-align: center; color: var(--dark-amber); font-weight: 600; display: none;">
            </div>

            <div id="cartTotalBox" style="background: #fff8eb; border: 1.5px solid #fae8d2; padding: 12px; border-radius: 12px; margin-bottom: 16px; font-size: 0.95rem; text-align: right;">
                <strong id="total-sum-text">Загальна сума: <span id="cartTotalSum">0</span> грн</strong>
            </div>

            <div id="cartInitialActions" class="cart-action-buttons">
                <button type="button" class="btn-checkout-start" onclick="showCheckoutForm()">Оформити замовлення</button>
                <button type="button" class="btn-continue-shopping" onclick="closeCartModal()">Продовжити покупку</button>
            </div>

            <div id="cartEmptyActions" style="display: none; margin-top: 15px;">
                <button type="button" class="btn-continue-shopping" style="width: 100%;" onclick="closeCartModal()">Додати товар</button>
            </div>

            <!-- Форма замовлення -->
            <form id="orderForm" style="display: none;" onsubmit="sendOrderToTelegram(event)">
                <div class="form-group">
                    <label id="label-name">ПІБ (Прізвище та Ім'я):</label>
                    <input type="text" id="orderName" required placeholder="Іванов Іван">
                </div>
                <div class="form-group">
                    <label id="label-phone">Номер телефону:</label>
                    <input type="tel" id="orderPhone" required placeholder="+380XXXXXXXXX">
                </div>
                <div class="form-group">
                    <label>Email (необов'язково):</label>
                    <input type="email" id="orderEmail" placeholder="example@gmail.com">
                </div>
                <div class="form-group">
                    <label id="label-delivery">Спосіб доставки:</label>
                    <select id="orderDelivery" required>
                        <option value="" disabled selected id="del-placeholder">Оберіть спосіб доставки</option>
                        <option value="Нова пошта" id="del-np">Нова пошта</option>
                        <option value="Укрпошта" id="del-ukr">Укрпошта</option>
                        <option value="Самовивіз" id="del-pickup">Самовивіз</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="label-comment">Коментар до замовлення:</label>
                    <textarea id="orderComment" rows="2" placeholder="Номер відділення, побажання тощо..."></textarea>
                </div>

                <div class="modal-buttons">
                    <button type="button" class="btn-close" onclick="closeCartModal()" id="btn-close-modal">Закрити</button>
                    <button type="submit" class="btn-submit" id="submitBtn">Надіслати замовлення</button>
                </div>
                <div id="orderStatus" style="margin-top: 10px; text-align: center; font-weight: 600;"></div>
            </form>
        </div>
    </div>

    <script>
        const BOT_TOKEN = '8812886094:AAFdw7NkHOSRB0If8ZMAME4tEbhwq1XCAZA';
        const CHAT_ID = '1763769244';
        const SUPABASE_URL = "https://wamchptycjrvrspfksaz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_lG-14NlLDyfmdeJTZ-a3Lg_oxyFvv3F";

        let cart = [];
        let currentLang = 'uk';

        window.onload = function() {
            const savedCart = localStorage.getItem('medova_cart');
            if (savedCart) {
                try {
                    cart = JSON.parse(savedCart);
                } catch (e) {
                    cart = [];
                }
            }
            updateCartUI();
        };

        function saveCart() {
            localStorage.setItem('medova_cart', JSON.stringify(cart));
        }

        function addToCartCommon(name, price, qty) {
            const existingIndex = cart.findIndex(item => item.name === name);
            if (existingIndex > -1) {
                cart[existingIndex].qty += qty;
            } else {
                cart.push({name, price, qty});
            }
            saveCart();
            updateCartUI();
        }

        function addToCart(name, price, qtyInputId) {
            const qty = parseInt(document.getElementById(qtyInputId).value) || 1;
            addToCartCommon(name, price, qty);
            document.getElementById(qtyInputId).value = 1;
        }

        function changeQty(id, delta) {
            const input = document.getElementById(id);
            let val = parseInt(input.value) || 1;
            val += delta;
            if(val < 1) val = 1;
            input.value = val;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            saveCart();
            updateCartUI();
            renderCartModal();
        }

        function updateCartUI() {
            const cartCount = document.getElementById('cartCount');
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            cartCount.innerText = totalQty;
        }

        function openCartModal() {
            renderCartModal();
            document.getElementById('cartModal').style.display = 'flex';
        }

        function closeCartModal() {
            document.getElementById('cartModal').style.display = 'none';
        }

        function showCheckoutForm() {
            document.getElementById('cartInitialActions').style.display = 'none';
            document.getElementById('orderForm').style.display = 'block';
        }

        function renderCartModal() {
            const listContainer = document.getElementById('cartItemsList');
            const totalSumElement = document.getElementById('cartTotalSum');
            const initialActions = document.getElementById('cartInitialActions');
            const emptyActions = document.getElementById('cartEmptyActions');
            const orderForm = document.getElementById('orderForm');
            const totalBox = document.getElementById('cartTotalBox');
            const progressBox = document.getElementById('deliveryProgressBox');

            orderForm.style.display = 'none';
            orderForm.reset();

            if (cart.length === 0) {
                listContainer.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:10px;">${currentLang === 'uk' ? 'Кошик порожній' : 'Корзина пуста'}</p>`;
                totalBox.style.display = 'none';
                progressBox.style.display = 'none';
                initialActions.style.display = 'none';
                emptyActions.style.display = 'block';
                return;
            }

            totalBox.style.display = 'block';
            initialActions.style.display = 'flex';
            emptyActions.style.display = 'none';

            let html = '';
            let totalSum = 0;

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.qty;
                totalSum += itemTotal;
                const priceText = `${itemTotal} грн (${item.qty} шт x ${item.price} грн)`;

                html += `
                    <div class="cart-item-row">
                        <div>
                            <strong>${item.name}</strong><br>
                            <small>${priceText}</small>
                        </div>
                        <div>
                            <button type="button" class="remove-btn" onclick="removeFromCart(${index})">✕</button>
                        </div>
                    </div>
                `;
            });

            listContainer.innerHTML = html;
            totalSumElement.innerText = totalSum;

            const threshold = 1000;
            progressBox.style.display = 'block';
            if (totalSum >= threshold) {
                progressBox.innerHTML = currentLang === 'uk' ? '🎉 Ура! У вас безкоштовна доставка!' : '🎉 Ура! У вас бесплатная доставка!';
                progressBox.style.color = '#16a34a';
                progressBox.style.borderColor = '#16a34a';
            } else {
                const diff = threshold - totalSum;
                progressBox.innerHTML = currentLang === 'uk' 
                    ? `🚚 До безкоштовної доставки не вистачає: <b>${diff} грн</b>` 
                    : `🚚 До бесплатной доставки не хватает: <b>${diff} грн</b>`;
                progressBox.style.color = 'var(--dark-amber)';
                progressBox.style.borderColor = 'var(--primary-amber)';
            }
        }

        async function sendOrderToTelegram(e) {
            e.preventDefault();
            const name = document.getElementById('orderName').value.trim();
            const phone = document.getElementById('orderPhone').value.trim();
            const email = document.getElementById('orderEmail').value.trim();
            const delivery = document.getElementById('orderDelivery').value;
            const comment = document.getElementById('orderComment').value.trim();
            const statusDiv = document.getElementById('orderStatus');

            if (cart.length === 0) return;

            let totalSum = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            let itemsDetails = cart.map(item => `• ${item.name} — ${item.qty} шт. (${item.price * item.qty} грн)`).join('\n');
            const fullItemsStr = cart.map(item => `${item.name} (${item.qty} шт.)`).join(', ');

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Відправка...';
            statusDiv.innerText = '';

            try {
                const orderPayload = {
                    id: 'ord_' + Date.now(),
                    customer_name: name,
                    phone: phone,
                    city_post: delivery,
                    items: fullItemsStr,
                    total_price: totalSum,
                    comment: comment || ''
                };

                const dbResponse = await fetch(`${SUPABASE_URL}/rest/v1/orders`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(orderPayload)
                });

                if (!dbResponse.ok) {
                    const responseText = await dbResponse.text();
                    throw new Error("Помилка бази Supabase: " + responseText);
                }

                const text = `<b>🛒 Нове замовлення в інтернет-магазині!</b>\n\n` +
                             `<b>👤 ПІБ:</b> ${name}\n` +
                             `<b>📞 Телефон:</b> ${phone}\n` +
                             `<b>📧 Email:</b> ${email || 'Не вказано'}\n` +
                             `<b>🚚 Доставка:</b> ${delivery}\n` +
                             `<b>💬 Коментар:</b> ${comment || 'Відсутній'}\n\n` +
                             `<b>📦 Товари:</b>\n${itemsDetails}\n\n` +
                             `<b>💰 Загальна сума:</b> ${totalSum} грн`;

                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: text,
                        parse_mode: 'HTML'
                    })
                });

                const data = await response.json();
                if (data.ok) {
                    statusDiv.style.color = '#16a34a';
                    statusDiv.innerText = '✅ Замовлення успішно надіслано та збережено в базі!';
                    cart = [];
                    saveCart();
                    updateCartUI();
                    setTimeout(() => {
                        closeCartModal();
                        statusDiv.innerText = '';
                    }, 2500);
                } else {
                    throw new Error(data.description || 'Помилка Telegram');
                }
            } catch (error) {
                statusDiv.style.color = '#dc2626';
                statusDiv.innerText = '❌ Помилка відправки. Спробуйте ще раз.';
                console.error("Деталі помилки:", error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Надіслати замовлення';
            }
        }
    </script>
