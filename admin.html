<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель адміністратора — Медова Пасіка</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-amber: #829b33;
            --dark-amber: #5a6d22;
            --accent-btn: #8fb339;
            --bg-gradient: #fcf9f2;
            --card-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            --text-main: #332417;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding: 15px; font-size: 0.9rem; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 25px; box-shadow: var(--card-shadow); border: 1px solid #eee; }
        
        h1, h2 { font-family: 'Comfortaa', cursive; color: var(--dark-amber); text-align: center; margin-bottom: 20px; }
        h1 { font-size: 1.5rem; }
        h2 { font-size: 1.1rem; text-align: left; margin-bottom: 15px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #666; font-size: 0.85rem; }
        .form-control { width: 100%; padding: 11px 14px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 0.95rem; background: #fff; outline: none; transition: border-color 0.2s; }
        .form-control:focus { border-color: var(--accent-btn); }

        .btn { background: #9bc53d; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; font-size: 1rem; transition: background 0.2s; text-align: center; display: block; text-decoration: none; }
        .btn:hover { background: #87b031; }
        .btn-secondary { background: #795548; margin-top: 20px; }
        .btn-danger { background: #d32f2f; padding: 6px 10px; font-size: 0.75rem; border-radius: 6px; color: white; border: none; cursor: pointer; font-weight: 600; }
        .btn-danger:hover { background: #b71c1c; }

        .card { background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        
        .table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        .table th, .table td { border: 1px solid #eee; padding: 10px; text-align: left; }
        .table th { background: #fcf9f2; color: var(--dark-amber); font-family: 'Comfortaa', cursive; font-size: 0.85rem; }

        .nav-links { display: flex; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; align-items: center; }
        .nav-links a { color: var(--dark-amber); text-decoration: none; font-weight: 700; font-size: 0.9rem; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-links">
            <a href="index.html">← На головну сайту</a>
            <span id="currentUserInfo" style="font-weight: 600; font-size: 0.85rem; color: #555;"></span>
        </div>

        <!-- ФОРМА ВХОДУ ДЛЯ ПЕРСОНАЛУ -->
        <div id="loginSection">
            <h1>🛠️ Вхід для співробітників</h1>
            <div class="card" style="max-width: 400px; margin: 20px auto;">
                <form onsubmit="handleStaffLogin(event)">
                    <div class="form-group">
                        <label>Логін:</label>
                        <input type="text" id="staffLogin" class="form-control" required placeholder="Логін">
                    </div>
                    <div class="form-group">
                        <label>Пароль:</label>
                        <input type="password" id="staffPass" class="form-control" required placeholder="Пароль">
                    </div>
                    <button type="submit" class="btn">Увійти в систему</button>
                </form>
            </div>
        </div>

        <!-- ПАНЕЛЬ АДМІНІСТРАТОРА -->
        <div id="adminPanel" style="display: none;">
            <h1>👑 Панель Адміністратора</h1>
            
            <div class="card">
                <h2>👥 Зареєстровані клієнти (з бази Supabase)</h2>
                <div id="registeredUsersList" style="overflow-x: auto;">Завантаження клієнтів з бази...</div>
            </div>

            <div class="grid-2">
                <div class="card" style="margin-bottom: 0;">
                    <h2>Створити співробітника</h2>
                    <form onsubmit="createEmployee(event)">
                        <div class="form-group">
                            <label>ПІБ співробітника:</label>
                            <input type="text" id="empName" class="form-control" required placeholder="Іван Іванов">
                        </div>
                        <div class="form-group">
                            <label>Посада:</label>
                            <input type="text" id="empRole" class="form-control" required placeholder="Пасічник">
                        </div>
                        <div class="form-group">
                            <label>Логін:</label>
                            <input type="text" id="empLogin" class="form-control" required placeholder="login">
                        </div>
                        <div class="form-group">
                            <label>Пароль:</label>
                            <input type="password" id="empPass" class="form-control" required placeholder="пароль">
                        </div>
                        <button type="submit" class="btn">Створити</button>
                    </form>
                </div>

                <div class="card" style="margin-bottom: 0;">
                    <h2>Призначити замовлення</h2>
                    <form onsubmit="assignOrder(event)">
                        <div class="form-group">
                            <label>Опис замовлення:</label>
                            <input type="text" id="ordDesc" class="form-control" required placeholder="Мед 3л">
                        </div>
                        <div class="form-group">
                            <label>Клієнт:</label>
                            <input type="text" id="ordClient" class="form-control" required placeholder="Олександр">
                        </div>
                        <div class="form-group">
                            <label>Виконавець:</label>
                            <select id="ordEmployee" class="form-control" required></select>
                        </div>
                        <button type="submit" class="btn" style="margin-top: 38px;">Призначити</button>
                    </form>
                </div>
            </div>

            <div class="card" style="margin-top: 20px;">
                <h2>📋 Список співробітників та замовлень</h2>
                <div id="allEmployeesList" style="margin-bottom: 15px;"></div>
                <div id="allOrdersList" style="overflow-x: auto;"></div>
            </div>

            <button class="btn btn-secondary" onclick="logoutStaff()">Вийти з аккаунта</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://wamchptycjrvrspfksaz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_lG-14NlLDyfmdeJTZ-a3Lg_oxyFvv3F";

        let db = JSON.parse(localStorage.getItem('medova_staff_db')) || {
            employees: [
                { id: 'admin', name: 'Головний Адмін', role: 'Адміністратор', login: 'admin1', pass: 'admin123', isAdmin: true }
            ],
            orders: []
        };

        function saveDb() {
            localStorage.setItem('medova_staff_db', JSON.stringify(db));
        }

        let currentStaff = JSON.parse(localStorage.getItem('medova_current_staff')) || null;

        function initStaffApp() {
            const loginSec = document.getElementById('loginSection');
            const adminSec = document.getElementById('adminPanel');
            const info = document.getElementById('currentUserInfo');

            if (!currentStaff) {
                loginSec.style.display = 'block';
                adminSec.style.display = 'none';
                info.innerText = '';
            } else if (currentStaff.isAdmin) {
                loginSec.style.display = 'none';
                adminSec.style.display = 'block';
                info.innerText = `Ви увійшли як: Адміністратор`;
                renderAdminData();
            }
        }

        function handleStaffLogin(e) {
            e.preventDefault();
            const login = document.getElementById('staffLogin').value.trim();
            const pass = document.getElementById('staffPass').value.trim();

            const found = db.employees.find(emp => emp.login === login && emp.pass === pass);
            if (found) {
                currentStaff = found;
                localStorage.setItem('medova_current_staff', JSON.stringify(currentStaff));
                initStaffApp();
            } else {
                alert('Невірний логін або пароль!');
            }
        }

        function logoutStaff() {
            currentStaff = null;
            localStorage.removeItem('medova_current_staff');
            initStaffApp();
        }

        async function deleteClientUser(userId) {
            if (confirm('Ви впевнені, що хочете видалити цього користувача з хмарної бази даних?')) {
                try {
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${userId}`, {
                        method: 'DELETE',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        }
                    });

                    if (!response.ok) throw new Error("Помилка видалення");

                    let curUser = null;
                    try { curUser = JSON.parse(localStorage.getItem('medova_current_user')); } catch(err) {}
                    if (curUser && curUser.id === userId) {
                        localStorage.removeItem('medova_current_user');
                    }

                    alert('Користувача успішно видалено з бази!');
                    renderAdminData();
                } catch (err) {
                    console.error(err);
                    alert("Помилка зв'язку з базою даних при видаленні.");
                }
            }
        }

        function createEmployee(e) {
            e.preventDefault();
            const name = document.getElementById('empName').value.trim();
            const role = document.getElementById('empRole').value.trim();
            const login = document.getElementById('empLogin').value.trim();
            const pass = document.getElementById('empPass').value.trim();

            if (db.employees.some(emp => emp.login === login)) {
                alert('Співробітник з таким логіном вже існує!');
                return;
            }

            db.employees.push({ id: 'emp_' + Date.now(), name, role, login, pass, isAdmin: false });
            saveDb();
            alert('Співробітника успішно зареєстровано!');
            e.target.reset();
            renderAdminData();
        }

        function assignOrder(e) {
            e.preventDefault();
            const desc = document.getElementById('ordDesc').value.trim();
            const client = document.getElementById('ordClient').value.trim();
            const empId = document.getElementById('ordEmployee').value;

            db.orders.push({
                id: 'ord_' + Date.now(),
                desc,
                client,
                empId,
                status: 'Новий',
                date: new Date().toLocaleDateString()
            });
            saveDb();
            alert('Замовлення створено!');
            e.target.reset();
            renderAdminData();
        }

        async function renderAdminData() {
            const usersContainer = document.getElementById('registeredUsersList');
            usersContainer.innerHTML = 'Завантаження з бази даних...';

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/users?select=*`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!response.ok) throw new Error("Помилка завантаження");
                const allUsers = await response.json();

                if (!allUsers || allUsers.length === 0) {
                    usersContainer.innerHTML = '<p style="font-size: 0.85rem; color: #666;">Поки немає зареєстрованих покупців у базі.</p>';
                } else {
                    let html = '<table class="table"><tr><th>№</th><th>Логін (Телефон / Email)</th><th>ПІБ</th><th>Адреса</th><th>Замовлення</th><th>Дія</th></tr>';
                    
                    allUsers.forEach((u, index) => {
                        const ordersCount = u.data?.orders ? u.data.orders.length : 0;
                        html += `<tr>
                            <td style="text-align: center; font-weight: bold;">${index + 1}</td>
                            <td><b>${u.login}</b></td>
                            <td>${u.full_name || 'Не вказано'}</td>
                            <td>${u.address || 'Не вказано'}</td>
                            <td>${ordersCount} замовлень</td>
                            <td><button class="btn-danger" onclick="deleteClientUser('${u.id}')">🗑️ Видалити</button></td>
                        </tr>`;
                    });
                    html += '</table>';
                    usersContainer.innerHTML = html;
                }
            } catch (err) {
                console.error(err);
                usersContainer.innerHTML = '<p style="font-size: 0.85rem; color: #d32f2f;">Помилка завантаження користувачів із бази даних.</p>';
            }

            const select = document.getElementById('ordEmployee');
            select.innerHTML = '';
            db.employees.filter(e => !e.isAdmin).forEach(emp => {
                select.innerHTML += `<option value="${emp.id}">${emp.name} (${emp.role})</option>`;
            });

            let empHtml = '<h3 style="font-family: \'Comfortaa\', cursive; font-size: 0.95rem; color: var(--dark-amber); margin-bottom: 8px;">Співробітники:</h3><ul style="margin-left: 20px; font-size: 0.85rem; color: #555;">';
            db.employees.filter(e => !e.isAdmin).forEach(emp => {
                empHtml += `<li style="margin-bottom: 4px;"><b>${emp.name}</b> — ${emp.role} (Логін: <code>${emp.login}</code>)</li>`;
            });
            empHtml += '</ul>';
            document.getElementById('allEmployeesList').innerHTML = empHtml;

            let ordHtml = '<h3 style="font-family: \'Comfortaa\', cursive; font-size: 0.95rem; color: var(--dark-amber); margin-bottom: 8px;">Замовлення:</h3>';
            if (db.orders.length === 0) {
                ordHtml += '<p style="font-size:0.85rem; color:#666;">Поки немає замовлень</p>';
            } else {
                ordHtml += '<table class="table"><tr><th>Дата</th><th>Опис</th><th>Клієнт</th><th>Статус</th></tr>';
                db.orders.forEach(ord => {
                    ordHtml += `<tr><td>${ord.date}</td><td>${ord.desc}</td><td>${ord.client}</td><td><b>${ord.status}</b></td></tr>`;
                });
                ordHtml += '</table>';
            }
            document.getElementById('allOrdersList').innerHTML = ordHtml;
        }

        document.addEventListener('DOMContentLoaded', initStaffApp);
    </script>
</body>
</html>
